<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InternMS · NEMSU Main Campus OJT Management Platform</title>
  <meta name="description" content="On-the-Job Training (OJT) placement, attendance, and compliance management platform for North Eastern Mindanao State University (NEMSU) Main Campus." />
  <meta name="theme-color" content="#F1F5F9" />
  <link rel="icon" type="image/png" href="./favicon-96x96.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F1F5F9; color: #0F172A; font-family: sans-serif;">

        <div style="font-size: 1.15rem; font-weight: 800; color: #0B2E6B;" translate="no">InternMS · NEMSU Main Campus</div>
        <div style="font-size: 0.85rem; color: #475569;">Loading workspace…</div>
